[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-mentor"
version = "0.1.0"
description = "A small, auditable framework for model pricing and project-aware recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "httpx>=0.27,<1"]

[project.scripts]
token-mentor = "token_mentor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

